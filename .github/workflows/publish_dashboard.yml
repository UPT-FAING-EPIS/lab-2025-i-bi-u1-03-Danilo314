name: Deploy Power BI Dashboard

on:
  push:
    branches:
      - main  # o la rama que utilices

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to Power BI pipeline
        uses: microsoft/powerbi-pipeline-deploy@v1
        with:
          client-id: ${{ secrets.PBI_CLIENT_ID }}
          client-secret: ${{ secrets.PBI_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PBI_TENANT_ID }}
          workspace-id: ${{ secrets.PBI_WORKSPACE_ID }}
          pipeline-id: ${{ secrets.PBI_PIPELINE_ID }}
          stage-order: 2  # Número de orden del stage (por ejemplo: Desarrollo=1, Producción=2)